<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Extreme heat at least twice as likely; extreme fire weather at least 30 percent more likely in climate models"><rect width="900" height="420" rx="18" fill="#f1f8f7"/><text x="42" y="54" fill="#164751" font-family="Arial,sans-serif" font-size="27" font-weight="bold">Two changes in weather risk</text><text x="42" y="86" fill="#526a70" font-family="Arial,sans-serif" font-size="16">Different events, different probability measures — not changes in fire counts</text><rect x="42" y="115" width="388" height="222" rx="16" fill="#ffffff" stroke="#c5dedb"/><rect x="470" y="115" width="388" height="222" rx="16" fill="#ffffff" stroke="#c5dedb"/><text x="68" y="160" fill="#164751" font-family="Arial,sans-serif" font-size="21" font-weight="bold">Extreme heat</text><text x="68" y="243" fill="#007c91" font-family="Arial,sans-serif" font-size="68" font-weight="bold">≥ 2×</text><text x="68" y="283" fill="#526a70" font-family="Arial,sans-serif" font-size="19">as likely</text><text x="496" y="160" fill="#164751" font-family="Arial,sans-serif" font-size="21" font-weight="bold">Extreme fire weather</text><text x="496" y="243" fill="#b54f34" font-family="Arial,sans-serif" font-size="65" font-weight="bold">≥ 30%</text><text x="496" y="283" fill="#526a70" font-family="Arial,sans-serif" font-size="19">increase in modelled probability</text><text x="42" y="382" fill="#526a70" font-family="Arial,sans-serif" font-size="16">Source: van Oldenborgh et al. (2021) · Summary of published attribution estimates</text></svg>